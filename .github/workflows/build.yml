name: Compiler Samoth Home

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Télécharger les polices (Unbounded, Inter — licence OFL)
        run: |
          mkdir -p app/src/main/res/font
          curl -fsSL --retry 4 -o app/src/main/res/font/unbounded.ttf "https://github.com/google/fonts/raw/main/ofl/unbounded/Unbounded%5Bwght%5D.ttf"
          curl -fsSL --retry 4 -o app/src/main/res/font/inter.ttf "https://github.com/google/fonts/raw/main/ofl/inter/Inter%5Bopsz,wght%5D.ttf"
          ls -la app/src/main/res/font

      - name: Compiler l'APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace -PBUILD_NUMBER=${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk SamothHome.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SamothHome-apk
          path: SamothHome.apk

      - name: Publier la version (utilisée par la mise à jour intégrée)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" SamothHome.apk \
            --title "Samoth Home · version ${{ github.run_number }}" \
            --notes "APK prêt à installer. Lien fixe vers la dernière version : https://github.com/${{ github.repository }}/releases/latest/download/SamothHome.apk" \
            --latest
